# Shared settings for every rollout in the experiment.

memory_probe:
  environment: memory_probe
  agent:
    provider: vllm            # OpenAI-compatible chat endpoint at VLLM_BASE_URL (the T4 server)
    model: LFM3-1.7B
    temperature: 0.6
    top_p: 0.95
    max_tokens: 65536         # backstop; finish_reason=length is recorded as truncated
    max_steps: 99999          # no turn cap
  task:
    command_timeout: 120
    memories: []
  prompts:
    system_prompt: |
      You are an autonomous agent with access to a UNIX shell environment.

      You have three tools available:
      1. `execute_command`: Run a shell command and get its output
      2. `read_memory`: Read one or more of your memories by id
      3. `write_memory`: Save a memory that future sessions can read

      How tool calling works:
      - Call the tool with the required parameters
      - The tool will be executed and you'll receive the output
      - You can then analyze the output and decide your next action

      When you are done, reply to the user directly without calling a tool.
    memory_preamble: |
      You can refer to your past memories to fulfill the user's query. Start by reading any relevant memories.
    user_prompt: ""

bootstrap_user_prompt: |
  Below is the log of the session you just finished.

  <session_log>
  {session_log}
  </session_log>

  Save a memory of this session using write_memory so that you can refer to it in future sessions.
